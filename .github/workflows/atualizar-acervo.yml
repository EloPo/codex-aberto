name: Atualizar acervo

on:
  schedule:
    - cron: '17 6 * * 1'   # toda segunda-feira, 03:17 em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Coletar acervo
        env:
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: node scripts/collect.mjs --openalex
      - name: Salvar dados atualizados
        run: |
          git config user.name "codex-aberto-bot"
          git config user.email "codex-aberto-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Atualiza acervo ($(date -u +%Y-%m-%d))"
          git push
